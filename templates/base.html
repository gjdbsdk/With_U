<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Hackathon Starter{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'frontend/css/app.css' %}" />
  </head>
  <body>
    <header class="navbar">
      <div class="container">
        <h1>Hackathon Django Starter</h1>
      </div>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <footer class="footer">
      <div class="container">
        제작: Django + DRF + Tailwind-ready 구조
      </div>
    </footer>
    <script src="{% static 'frontend/js/app.js' %}"></script>
  </body>
</html>
