{% extends "base.html" %}
{% load static %}

{% block style %}
<link rel="stylesheet" href="{% static 'css/register.css' %}">
{% endblock style %}

{% block body %}
<section class="register-page">
  <div class="register-card">
    <div class="register-card__header">
      <h1>With U 회원가입</h1>
      <p>간편한 가입으로 시민 참여 콘텐츠를 시작해보세요.</p>
    </div>

    <div class="register-alert" id="register-alert"></div>

    <form id="register-form">
      {% csrf_token %}
      <div class="register-form__group">
        <label for="reg-username">아이디</label>
        <input type="text" id="reg-username" placeholder="아이디를 입력하세요" required>
      </div>
      <div class="register-form__group">
        <label for="reg-email">이메일</label>
        <input type="email" id="reg-email" placeholder="연락 가능한 이메일" required>
      </div>
      <div class="register-form__group">
        <label for="reg-password">비밀번호</label>
        <input type="password" id="reg-password" placeholder="비밀번호 (8자 이상)" required>
      </div>
      <div class="register-form__group">
        <label for="reg-password2">비밀번호 확인</label>
        <input type="password" id="reg-password2" placeholder="비밀번호 재입력" required>
      </div>
      <button type="button" class="register-btn" id="register-btn">회원가입 완료</button>
    </form>

    <p class="register-extra">
      이미 계정이 있다면? <a href="/logindemo/?next=/citizen/">로그인하기</a>
    </p>
  </div>
</section>
{% endblock body %}

{% block script %}
<script>
  const csrftoken = document.querySelector("[name=csrfmiddlewaretoken]").value;
  const urlParams = new URLSearchParams(window.location.search);
  const redirectUrl = urlParams.get("next") || "/citizen/";
  const registerAlert = document.getElementById("register-alert");

  function setRegisterAlert(message, type = "error") {
    registerAlert.textContent = message;
    registerAlert.className = "register-alert is-visible " + (type === "success" ? "register-alert--success" : "register-alert--error");
  }

  async function requestJson(url, payload) {
    const response = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": csrftoken,
      },
      body: JSON.stringify(payload),
    });
    const data = await response.json();
    if (!response.ok) {
      throw data;
    }
    return data;
  }

  document.getElementById("register-btn").addEventListener("click", async () => {
    const username = document.getElementById("reg-username").value.trim();
    const email = document.getElementById("reg-email").value.trim();
    const password = document.getElementById("reg-password").value.trim();
    const password2 = document.getElementById("reg-password2").value.trim();

    if (!username || !email || !password || !password2) {
      setRegisterAlert("모든 입력칸을 채워주세요.");
      return;
    }
    if (password.length < 8) {
      setRegisterAlert("비밀번호는 8자 이상이어야 합니다.");
      return;
    }
    if (password !== password2) {
      setRegisterAlert("비밀번호가 일치하지 않습니다.");
      return;
    }

    try {
      await requestJson("/api/register/", { username, email, password });
      setRegisterAlert("회원가입이 완료되었습니다. 잠시 후 로그인 페이지로 이동합니다.", "success");
      setTimeout(() => {
        window.location.href = `/logindemo/?next=${encodeURIComponent(redirectUrl)}`;
      }, 800);
    } catch (error) {
      if (error.username) {
        setRegisterAlert(error.username[0]);
      } else if (error.email) {
        setRegisterAlert(error.email[0]);
      } else {
        setRegisterAlert(error.message || "회원가입 처리에 실패했습니다.");
      }
    }
  });

</script>
{% endblock script %}
