{% extends "base.html" %}
{% load static %}

{% block style %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock style %}

{% block script %}
    <script defer src="{% static 'js/login.js' %}"></script>
{% endblock script %}

{% block body %}
<section class="login-page">
  <div class="login-card">
    <div class="login-card__header">
      <h1>With U 로그인</h1>
      <p>안전한 시민 콘텐츠 플랫폼을 위해 로그인 후 이용해주세요.</p>
    </div>

    <div class="login-alert" id="login-alert"></div>

    <form id="login-form">
      {% csrf_token %}  
      <div class="login-form__group">
        <label for="username">아이디</label>
        <input type="text" id="username" placeholder="아이디를 입력하세요" required>
      </div>
      <div class="login-form__group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
      </div>
      <div class="login-actions">
        <button type="button" class="login-btn" id="login-btn">로그인</button>
      </div>
    </form>

    <p class="login-extra">
      계정이 없다면?
      <a href="/registerdemo/">회원가입하기</a>
    </p>
  </div>
</section>
{% endblock body %}
