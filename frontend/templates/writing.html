{% extends "base.html" %}
{% load static %}

{% block style %}
<link rel="stylesheet" href="{% static 'css/writing.css' %}">
{% endblock style %}

{% block script %}
<script>
document.addEventListener("DOMContentLoaded", function () {
    const btn = document.querySelector(".submit-btn");
    const titleInput = document.getElementById("title");
    const titleCount = document.getElementById("title-count"); // 있으면 업데이트, 없어도 무시

    // 실시간 글자수 표시만 (절삭하지 않음)
    titleInput.addEventListener("input", () => {
        if (titleCount) {
            titleCount.textContent = `${titleInput.value.length}/45`;
        }
    });

    btn.addEventListener("click", async () => {
        const title = titleInput.value.trim();
        const content = document.getElementById("content").value.trim();

        // 빈 값 체크
        if (!title || !content) {
            alert("제목과 내용을 모두 입력해주세요.");
            return;
        }

        // 길이 초과 체크 — 여기서 차단
        if (title.length > 45) {
            alert("제목은 45자 이내여야 합니다.");
            // 포커스 돌려서 수정 유도
            titleInput.focus();
            return;
        }

        const csrfToken = "{{ csrf_token }}";

        const res = await fetch("/api/community/write/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfToken
            },
            body: JSON.stringify({ title, content })
        });

        if (res.status === 401) {
            alert("로그인이 필요합니다.");
            location.href = "/logindemo/";
            return;
        }

        if (res.ok) {
            alert("게시글이 작성되었습니다.");
            location.href = "/community/";
        } else {
            alert("작성 실패");
        }
    });
});
</script>

{% endblock script %}

{% block body %}

<section class="detail-container">
    <div class="detail-top">
        <a href="/community/" class="back-btn">
            <img src="{% static 'img/toprev.png' %}" alt="" class="toprev">
            기존 토론 목록으로
        </a>
    </div>

    <div class="contentzone">
        <div class="detail-body">
            <div class="content-share__form-wrapper">
                <form class="content-share__form" method="post">
                {% csrf_token %}
                <div class="formtitle">새 토론 시작</div>

                <div class="inputss">
                    <div class="form-group">
                        <label for="title">제목</label>
                        <input type="text" id="title" name="title" placeholder="콘텐츠 제목을 입력하세요." required>
                    </div>

                    <div class="form-group">
                        <label for="content">내용</label>
                        <textarea id="content" name="content" placeholder="경험을 공유하고, 조언을 구하며, 함께 성장하세요." required></textarea>
                    </div>
                </div>

                <div class="btnhugger">
                    <button type="button" class="submit-btn">새 토론 제출</button>
                </div>
                </form>
            </div>
        </div>
    </div>
</section>

{% endblock body %}
